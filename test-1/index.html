  <!-- Google Tag Manager -->
<script>
(function(w,d,s,l,i){
  w[l]=w[l]||[];
  w[l].push({'gtm.start': new Date().getTime(),event:'gtm.js'});
  var f=d.getElementsByTagName(s)[0],
      j=d.createElement(s),
      dl=l!='dataLayer'?'&l='+l:'';
  j.async=true;
  j.src='https://www.googletagmanager.com/gtm.js?id=GTM-NTNSNWW2'+dl;

</script>
<!-- End Google Tag Manager -->

<!-- 📊 profile_view event (disparado después de load) -->
<script>
  window.addEventListener("load", function () {
    if (!window.profileData || !window.profileData.slug) return;

    const params = new URLSearchParams(window.location.search);

    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      event: "profile_view",
      profile_slug: window.profileData.slug,
      profile_name: window.profileData.name,
      profile_source: params.get("src") || "direct",
      profile_card: params.get("card") || "profile",
      profile_location: window.location.pathname
    });
  });
</script>
<!-- End profile_view event -->

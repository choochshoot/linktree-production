<!-- 📊 profile_view event (disparado después de load) -->
<script>
  window.addEventListener("load", function () {
    if (!window.profileData || !window.profileData.slug) return;

    const params = new URLSearchParams(window.location.search);

    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      event: "profile_view",
      profile_slug: window.profileData.slug,
      profile_name: window.profileData.name,
      profile_source: params.get("src") || "direct",
      profile_card: params.get("card") || "profile",
      profile_location: window.location.pathname
    });
  });
</script>
<!-- End profile_view event -->
